<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDCA Global Engagement Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; min-height: 350px; }
    .mapboxgl-popup-content { border-radius: 12px; padding: 18px 20px; box-shadow: 0 5px 22px rgba(0,0,0,.20); font: 14px/1.5 Arial, Helvetica, sans-serif; }
    .sdca-title { margin: 0 22px 2px 0; font-size: 18px; line-height: 1.35; color: #17252e; }
    .sdca-group { color: #6d547c; font-size: 12px; font-weight: 600; margin: 0 0 12px; }
    .sdca-description { color: #34434a; margin: 8px 0 12px; white-space: pre-wrap; }
    .sdca-link { display: inline-block; margin-top: 2px; color: #1955b5; font-weight: 700; text-decoration: underline; }
    .sdca-link:focus-visible { outline: 2px solid #1955b5; outline-offset: 4px; }
    #error { display: none; position: absolute; z-index: 5; left: 15px; right: 15px; top: 15px; padding: 12px; color: #631e15; background: #fff4f1; border: 1px solid #e1a398; border-radius: 8px; font: 14px Arial, sans-serif; }

    /* Branding overlay; keep the PNG transparent. */
    #lu-logo {
      position: absolute;
      z-index: 10;
      top: 20px;
      left: 20px;
      width: 180px;
      max-width: 40vw;
      height: auto;
      box-sizing: border-box;
      padding: 14px;
      background: transparent;
      border-radius: 10px;
      pointer-events: none;
    }

    /* Legend sits just beneath the university logo. */
    #sdca-legend {
      position: absolute;
      z-index: 10;
      top: 97px;
      left: 34px;
      box-sizing: border-box;
      max-width: calc(100vw - 64px);
      padding: 11px 14px 12px;
      border-radius: 9px;
      color: #fff;
      background: rgba(35,35,35,.75);
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      font: 13px/1.4 Arial, Helvetica, sans-serif;
      pointer-events: none;
    }
    .sdca-legend-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; letter-spacing: .02em; }
    .sdca-legend-item { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .sdca-legend-item + .sdca-legend-item { margin-top: 7px; }
    .sdca-legend-swatch {
      display: inline-block;
      width: 18px;
      height: 18px;
      box-sizing: border-box;
      flex: none;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }
    .sdca-legend-placement { background: #F0047F; }
    .sdca-legend-exchange { background: #2D0153; }
    @media (max-width: 480px) {
      #lu-logo { width: 158px; }
      #sdca-legend { left: 34px; top: 88px; font-size: 12px; padding: 9px 11px; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Interactive SDCA Global Engagement Map"></div>
  <img id="lu-logo" src="LU-logo-white.png" alt="Loughborough University logo">
  <aside id="sdca-legend" aria-label="Map key">
    <div class="sdca-legend-title">Map key</div>
    <div class="sdca-legend-item"><span class="sdca-legend-swatch sdca-legend-placement" aria-hidden="true"></span><span>Student Placements</span></div>
    <div class="sdca-legend-item"><span class="sdca-legend-swatch sdca-legend-exchange" aria-hidden="true"></span><span>Exchange Programmes</span></div>
  </aside>
  <div id="error" role="alert"></div>
  <script>
  (() => {
    // Existing published Mapbox style and public token.
    mapboxgl.accessToken = 'pk.eyJ1IjoiY2hyaXN1eGQiLCJhIjoiY21tZXQ3dnRpMDB5YjJwczhzaXdnZ3VmNCJ9.HLg634ycbIvgXNwmRPDCHg';
    const POINT_LAYER = 'GE Data';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/chrisuxd/cmmewcucc00j001qz3xo68y0z',
      center: [-34, 38],
      zoom: 2,
      scrollZoom: false
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    const error = message => {
      const element = document.getElementById('error');
      element.textContent = message;
      element.style.display = 'block';
      console.error(message);
    };

    const emptyClickFilter = ['==', ['get', 'id'], '__no_point_selected__'];
    let clickOutlineReady = false;
    let popup = null;
    function matchingFeatureFilter(feature) {
      const p = feature.properties || {};
      if (p.id !== undefined && p.id !== null) return ['==', ['get', 'id'], p.id];
      if (p.name) return ['==', ['get', 'name'], p.name];
      return emptyClickFilter;
    }

    function setClickOutline(feature) {
      if (!clickOutlineReady || !map.getLayer('sdca-click-outline')) return;
      map.setFilter('sdca-click-outline', feature ? matchingFeatureFilter(feature) : emptyClickFilter);
    }
    map.on('load', () => {
      const layer = map.getLayer(POINT_LAYER);
      if (!layer) {
        error('The “GE Data” layer was not found. Check the published Mapbox Studio style.');
        return;
      }
      // Keep the original click-selection halo when the source is a vector tileset.
      if (layer.source && layer['source-layer']) {
        map.addLayer({
          id: 'sdca-click-outline', type: 'circle',
          source: layer.source, 'source-layer': layer['source-layer'],
          filter: emptyClickFilter,
          paint: {
            'circle-radius': 17,
            'circle-color': '#ffffff',
            'circle-opacity': 0.12,
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 3
          }
        }, POINT_LAYER);
        clickOutlineReady = true;
      }
      // Hover: use the SAME source, layer and colour expression as GE Data.
      // This makes the enlarged dot exactly the colour it already has on the map.
      // No guesswork based on the `group` or raw `color` dataset fields.
      const ORIGINAL_COLOUR = map.getPaintProperty(POINT_LAYER, 'circle-color');
      const originalFilter = layer.filter || null;
      let hoveredKey = null;
      const HOVER_HALO = 'sdca-hover-halo';
      const HOVER_DOT = 'sdca-hover-marker';
      let hoverReady = false;
      if (layer.source && layer['source-layer'] && ORIGINAL_COLOUR !== undefined) {
        const shared = {
          type: 'circle',
          source: layer.source,
          'source-layer': layer['source-layer']
        };
        const initialFilter = originalFilter
          ? ['all', originalFilter, emptyClickFilter]
          : emptyClickFilter;
        // Soft white halo behind the larger colour-filled point.
        map.addLayer({
          ...shared,
          id: HOVER_HALO,
          filter: initialFilter,
          paint: {
            'circle-radius': 19,
            'circle-color': '#ffffff',
            'circle-opacity': 0.16
          }
        });
        // CRITICAL: copy the original Mapbox Studio circle-colour expression.
        // Since this layer uses the same tileset, each point keeps its original colour.
        map.addLayer({
          ...shared,
          id: HOVER_DOT,
          filter: initialFilter,
          paint: {
            'circle-radius': 14,
            'circle-color': ORIGINAL_COLOUR,
            'circle-opacity': 1,
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 3
          }
        });
        hoverReady = true;
      } else {
        console.warn('Hover overlay could not use GE Data styling; pointer cursor still works.');
      }
      const setHover = (feature) => {
        const p = feature?.properties || {};
        const coords = feature?.geometry?.coordinates || [];
        const nextKey = feature
          ? String(p.id ?? feature.id ?? `${coords[0]},${coords[1]}`)
          : null;
        if (nextKey === hoveredKey) return;
        hoveredKey = nextKey;
        map.getCanvas().style.cursor = feature ? 'pointer' : '';
        if (!hoverReady) return;
        const featureFilter = feature ? matchingFeatureFilter(feature) : emptyClickFilter;
        const filter = originalFilter
          ? ['all', originalFilter, featureFilter]
          : featureFilter;
        map.setFilter(HOVER_HALO, filter);
        map.setFilter(HOVER_DOT, filter);
      };
      // Check only the original points, ignoring the decorative hover layers.
      map.on('mousemove', event => {
        const features = map.queryRenderedFeatures(event.point, { layers: [POINT_LAYER] });
        const point = features.find(f => f.geometry?.type === 'Point');
        setHover(point || null);
      });
      map.getCanvas().addEventListener('mouseleave', () => setHover(null));
      // Existing popup behaviour, unchanged.
      map.on('click', POINT_LAYER, event => {
        const feature = event.features && event.features[0];
        if (!feature) return;
        const fields = feature.properties || {};
        if (popup) popup.remove();
        setClickOutline(feature);
        const body = document.createElement('div');
        const heading = document.createElement('h3');
        heading.className = 'sdca-title';
        heading.textContent = fields.name || 'Location';
        body.append(heading);
        if (fields.group) {
          const group = document.createElement('p');
          group.className = 'sdca-group';
          group.textContent = fields.group;
          body.append(group);
        }
        if (fields.description) {
          const description = document.createElement('p');
          description.className = 'sdca-description';
          description.textContent = fields.description;
          body.append(description);
        }
        if (fields.url) {
          try {
            const url = new URL(fields.url);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
              const link = document.createElement('a');
              link.className = 'sdca-link';
              link.href = url.href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = 'Visit website ↗';
              body.append(link);
            }
          } catch (e) {
            console.warn('Invalid external URL for', fields.name);
          }
        }
        const coordinates = feature.geometry && feature.geometry.type === 'Point'
          ? feature.geometry.coordinates.slice()
          : [event.lngLat.lng, event.lngLat.lat];
        popup = new mapboxgl.Popup({ offset: 17, maxWidth: '340px', closeOnClick: true })
          .setLngLat(coordinates)
          .setDOMContent(body)
          .addTo(map);
        popup.on('close', () => {
          setClickOutline(null);
          popup = null;
        });
      });
    });
  })();
  </script>
</body>
</html>
